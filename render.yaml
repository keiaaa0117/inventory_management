services:
  - type: web
    name: order-management-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/customers
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: order-management-db
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://order-management-frontend-npj5.onrender.com

  - type: web
    name: order-management-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://order-management-backend-8rk6.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: order-management-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: order_db
    user: order_user
