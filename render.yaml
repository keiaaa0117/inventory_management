services:
  - type: web
    name: inventory-management-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/customers
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-management-db
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://inventory-management-frontend-bncg.onrender.com

  - type: web
    name: inventory-management-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://inventory-management-backend-dz8b.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: inventory-management-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: inventory_db_ew79
    user: inventory_db_ew79_user
